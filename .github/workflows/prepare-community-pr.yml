# pull_request_target runs this workflow file from the base branch (e.g. main), not the PR
# branch. Edits here only affect CI after they land on the default branch.
#
# Prepares an integration branch + PR so full CI runs (including jobs that need repo
# secrets) for approved community PRs that are difficult to validate directly from forks.
#
# Security model:
# - Do NOT checkout the PR branch as the workspace root (no execution of PR-supplied
#   Action config from the PR ref as the checked-out tree for later steps).
# - Use only numeric PR id, default base branch, and a 40-hex SHA from the event.
# - Require at least one APPROVED review for the current head commit before proceeding.
# - Approval is verified via 'gh pr view --json reviews' (no manual API pagination).
# - Changed files are enumerated with 'git diff' (no API calls, path traversal checks).
# - pull_request_target is required so GITHUB_TOKEN can push for fork-based PRs.
name: Prepare community PR

on:
  workflow_call: {}
  pull_request_target:
    types: [labeled]

concurrency:
  group: prepare-community-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Open integration PR
    if: >-
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.draft == false &&
      github.event.label.name == 'prepare-community-pr' &&
      github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      REPO_FULL: ${{ github.repository }}
    steps:
      - name: Validate event inputs
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${HEAD_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "head.sha is not a 40-hex SHA; refusing to continue." >&2
            exit 1
          fi
          if [[ ! "${PR_NUMBER}" =~ ^[0-9]+$ ]]; then
            echo "pull_request.number is not numeric; refusing to continue." >&2
            exit 1
          fi

      - name: Verify approval for current PR head
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          head_lc="${HEAD_SHA,,}"
          
          # Use gh pr view to get all reviews without manual pagination
          reviews_json="$(gh pr view "${PR_NUMBER}" --repo "${REPO_FULL}" --json reviews,headRefOid)"
          
          # Verify the PR head matches what we expect
          pr_head="$(jq -r '.headRefOid // ""' <<<"${reviews_json}")"
          pr_head_lc="${pr_head,,}"
          if [[ "${pr_head_lc}" != "${head_lc}" ]]; then
            echo "PR head from view (${pr_head}) does not match event head.sha ${HEAD_SHA}." >&2
            exit 1
          fi
          
          # Count APPROVED reviews for the current head commit
          approved_for_head="$(
            jq --arg head "${head_lc}" '
              [.reviews[]? | select(.state == "APPROVED" and (((.commit.oid // "") | ascii_downcase) == $head))]
              | length
            ' <<<"${reviews_json}"
          )"
          
          if [[ "${approved_for_head}" -lt 1 ]]; then
            echo "PR #${PR_NUMBER} has no APPROVED review recorded for head ${HEAD_SHA}." >&2
            echo "Push a new commit or re-request review, then remove and re-apply the label." >&2
            exit 1
          fi

      - name: Check out default base branch (trusted ref only)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify changed files and create prep branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config --global user.name 'github-actions[bot]'
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin "${BASE_REF}"
          git reset --hard "origin/${BASE_REF}"

          git fetch origin "pull/${PR_NUMBER}/head"
          fetched="$(git rev-parse FETCH_HEAD)"
          head_lc="${HEAD_SHA,,}"
          fetched_lc="${fetched,,}"
          if [[ "${fetched_lc}" != "${head_lc}" ]]; then
            echo "Fetched PR head ${fetched} does not match event head.sha ${HEAD_SHA}; refusing to merge." >&2
            exit 1
          fi

          # Verify changed files using git diff with NUL delimiter (prevents newline injection)
          diff_file="$(mktemp)"
          if ! git diff --name-only -z "origin/${BASE_REF}...FETCH_HEAD" >"${diff_file}"; then
            echo "git diff --name-only failed (bad refs?)." >&2
            rm -f "${diff_file}"
            exit 1
          fi
          
          mapfile -d '' -t files <"${diff_file}"
          rm -f "${diff_file}"

          if [[ "${#files[@]}" -eq 0 || ( "${#files[@]}" -eq 1 && -z "${files[0]}" ) ]]; then
            echo "PR has no changed files relative to ${BASE_REF}; nothing to prepare." >&2
            exit 1
          fi

          # Security checks on changed files
          for f in "${files[@]}"; do
            if [[ -z "${f}" ]]; then
              continue
            fi
            
            # Block path traversal attacks
            if [[ "${f}" == *".."* ]]; then
              echo "SECURITY: Rejecting path containing '..': ${f}" >&2
              exit 1
            fi
            # Block workflow/action file changes (prevents secret exfiltration)
            if [[ "${f}" == .github/workflows/* ]] || [[ "${f}" == .github/actions/* ]]; then
              echo "SECURITY: Rejecting workflow/action file change: ${f}" >&2
              echo "Workflow changes from community PRs are not allowed." >&2
              echo "Submit workflow changes in a separate PR from a rundeck org member." >&2
              exit 1
            fi
          done

          # Create and push the prep branch from base (no community changes yet).
          # The original PR will be re-targeted to this branch so merging it via
          # GitHub marks it as "Merged", giving the contributor proper closure.
          prep_branch="bot/prep-community-pr-${PR_NUMBER}"
          git checkout -B "${prep_branch}"
          git push --force-with-lease origin "HEAD:${prep_branch}"

      - name: Retarget and merge community PR into prep branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          prep_branch="bot/prep-community-pr-${PR_NUMBER}"

          # Re-target the original PR's base to the prep branch.
          # The bot branch has no branch-protection rules, so the merge proceeds
          # immediately without waiting for CI, giving the contributor a "Merged" badge.
          if ! gh pr edit "${PR_NUMBER}" --repo "${REPO_FULL}" --base "${prep_branch}"; then
            body_file="$(mktemp)"
            {
              printf 'The `prepare-community-pr` workflow could not retarget this PR to `%s`.\n\n' "${prep_branch}"
              printf 'This can happen if the PR was closed before the workflow ran, or due to a transient API failure. '
              printf 'Remove and re-apply the `prepare-community-pr` label to retry.\n'
            } >"${body_file}"
            gh pr comment "${PR_NUMBER}" --repo "${REPO_FULL}" --body-file "${body_file}" || true
            rm -f "${body_file}"
            exit 1
          fi

          # Pass --match-head-commit to ensure we merge the exact SHA that was security-checked
          # above, not a newer commit that may have been pushed to the fork in the interim.
          if ! gh pr merge "${PR_NUMBER}" \
               --repo "${REPO_FULL}" \
               --merge \
               --match-head-commit "${HEAD_SHA}" \
               --subject "Merge community PR #${PR_NUMBER} into CI prep branch" \
               --body "Merged by the prepare-community-pr workflow to enable full CI with repository secrets."; then
            # Restore the original base so the PR is not left in a broken state
            gh pr edit "${PR_NUMBER}" --repo "${REPO_FULL}" --base "${BASE_REF}" || true
            body_file="$(mktemp)"
            {
              printf 'The `prepare-community-pr` workflow could not merge this PR into `%s`.\n\n' "${prep_branch}"
              printf 'This is usually caused by merge conflicts. Resolve conflicts against `%s`, then remove and re-apply the `prepare-community-pr` label.\n' "${BASE_REF}"
            } >"${body_file}"
            gh pr comment "${PR_NUMBER}" --repo "${REPO_FULL}" --body-file "${body_file}"
            rm -f "${body_file}"
            exit 1
          fi

      - name: Open or refresh integration pull request
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          prep_branch="bot/prep-community-pr-${PR_NUMBER}"
          origin_url="https://github.com/${REPO_FULL}/pull/${PR_NUMBER}"

          # Carry over the original title and description. Both are contributor-controlled
          # text: they are only ever written to files / passed as quoted arguments, never
          # interpolated into a shell command, and they are sanitized first. The sanitizer:
          # - drops HTML comments (invisible when rendered, but visible to Copilot/LLMs, so a
          #   common place to hide injected instructions),
          # - drops control, bidi and zero-width characters,
          # - defuses @mentions (user/team pings and @copilot) with a zero-width space,
          # - caps the length.
          sanitize() {
            MAX="$1" perl -CSD -0777 -pe '
              s/<!--.*?(?:-->|\z)//gs;
              s/[^\P{C}\n\t]//g;
              s/(?<!\w)@(?=[A-Za-z0-9])/@\x{200B}/g;
              $_ = substr($_, 0, $ENV{MAX});
            '
          }

          pr_json="$(gh pr view "${PR_NUMBER}" --repo "${REPO_FULL}" --json title,body,author)"
          title="$(jq -r '.title // ""' <<<"${pr_json}" | tr '\n' ' ' | sanitize 200)"
          if [[ -z "${title//[[:space:]]/}" ]]; then
            title="Community PR #${PR_NUMBER}"
          fi
          author="$(jq -r '.author.login // "unknown"' <<<"${pr_json}")"
          if [[ ! "${author}" =~ ^[A-Za-z0-9][A-Za-z0-9-]*(\[bot\])?$ ]]; then
            author="unknown"
          fi
          orig_body="$(jq -r '.body // ""' <<<"${pr_json}" | sanitize 20000)"

          body_file="$(mktemp)"
          {
            printf '%s\n\n' "Integration PR opened automatically so full CI (including jobs that require repository secrets) can run on the merged result."
            printf '%s\n\n' "Original community PR (already merged into this branch): ${origin_url} by \`${author}\`"
            printf '%s\n\n' '---'
            printf '%s\n' "${orig_body}"
          } >"${body_file}"

          existing="$(
            gh pr list \
              --repo "${REPO_FULL}" \
              --head "${prep_branch}" \
              --base "${BASE_REF}" \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [[ -n "${existing}" ]]; then
            gh pr edit "${existing}" \
              --repo "${REPO_FULL}" \
              --title "${title}" \
              --body-file "${body_file}"
            echo "Updated existing PR #${existing}."
          else
            new_pr_url="$(
              gh pr create \
                --repo "${REPO_FULL}" \
                --base "${BASE_REF}" \
                --head "${prep_branch}" \
                --title "${title}" \
                --body-file "${body_file}"
            )"
            echo "Created ${new_pr_url}."

            # Ask Copilot to fill in the release notes. Static text only (no contributor
            # content), and only on create so a re-run does not re-ping Copilot.
            gh pr comment "${new_pr_url}" \
              --body "@copilot Please fill in the \`Release Notes\` section of this PR description with a short, to-the-point note (one or two sentences) that tells Rundeck customers why this change matters or how it benefits them. Skip implementation details, and do not change any other part of the description."
          fi
          rm -f "${body_file}"
