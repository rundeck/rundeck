{% if exists("/rundeck/grails/upload/maxsize") %}
{%- set size = getv("/rundeck/grails/upload/maxsize") %}
# Grails 8 rejects grails.controllers.upload.* outright: GrailsControllersEnvironmentPostProcessor
# throws while the environment is being prepared, before any context exists, so the container cannot
# start at all. Spring Boot's own multipart properties replace them, and take a bare number as bytes,
# which is what RUNDECK_GRAILS_UPLOAD_MAXSIZE has always carried.
spring.servlet.multipart.maxFileSize={{ size }}
spring.servlet.multipart.maxRequestSize={{ size }}
rundeck.fileUploadService.tempfile.maxsize={{ size }}
{% endif %}
