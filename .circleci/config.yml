version: 2.1

orbs:
  node: circleci/node@7.2.1

executors:
  ui-tests:
    docker:
      - image: cimg/openjdk:17.0.20@sha256:f5468d6ddf3849e811edcf03329f013494549e63cf06037302aa7514c3cf41ff

jobs:
  unit-tests:
    executor: ui-tests
    working_directory: /home/circleci/workspace
    steps:
      - checkout
      - node/install:
          use-nvm-cache: true
          nvm-cache-key: ui-trellis-nvm-{{ checksum ".nvmrc" }}
      - run:
          name: Run ui-trellis Vitest suite
          command: |
            source scripts/circleci/setup.sh
            rundeck_gui_tests
      - store_test_results:
          path: rundeckapp/grails-spa/packages/ui-trellis/build/test-results

workflows:
  unit-tests:
    jobs:
      - unit-tests:
          context: Cloudsmith
