#####################################################################
# Rundeck Build Properties
#####################################################################
group=org.rundeck
currentVersion = 6.3.0
grailsVersion=8.0.0-M5
# springBootVersion / springVersion / groovyVersion must match the published org.apache.grails:grails-bom for grailsVersion (Grails pins Spring aggressively).
# Core framework versions - prefer BOM-managed versions where possible
# Required for plugin declaration in build.gradle
springBootVersion=4.1.0
nodeGradlePluginVersion=7.1.0
springVersion=7.0.9
micronautPlatformVersion=4.9.4
micronautOpenapiVersion=6.20.0
# Grails 8/Spring Boot 4: spring-cloud-context 4.3.x's RefreshAutoConfiguration is compiled against
# org.springframework.boot.ConfigurableBootstrapContext, which moved to
# org.springframework.boot.bootstrap.ConfigurableBootstrapContext in Boot 4 -- causes a
# NoClassDefFoundError at context refresh. 5.x is the Spring Cloud train built against Boot 4.
springCloudContextVersion=5.0.3
springIntegrationVersion=6.5.10
swaggerVersion=2.2.54
# hibernateVersion managed by Grails BOM (GORM 9.x uses Hibernate 6.x for Jakarta support)
hibernateVersion=5.6.15.Final
groovyVersion=5.0.8
codenarcVersion=3.6.0
gmetricsVersion=2.1.0
mavenCentralUrl=https://repo1.maven.org/maven2/
grailsCentralUrl=https://grails.org/plugins
jacksonDatabindVersion=2.22.2
jacksonDataformatCBORVersion=2.22.2
jacksonAnnotationsVersion=2.22
snakeyamlVersion=2.6
gsonVersion=2.14.0
# Updated from 1.22.1 - fixes CVE-2026-71497 (transitive via micronaut-openapi)
jsoupVersion=1.23.2
httpCoreVersion=4.4.16
httpClientVersion=4.5.14
# CVE-2026-54399 (SNYK-JAVA-ORGAPACHEHTTPCOMPONENTSCORE5-17817218): httpcore5-h2 HTTP/2 DoS,
# fixed in 5.4.2. Pulled transitively via grails-data-hibernate5-dbmigration -> grails-shell-cli
# -> spring-boot-cli -> httpclient5. Applies to both httpcore5 and httpcore5-h2 (released together).
httpCore5Version=5.4.3
# RUN-4791 / CVE-2026-64607: httpclient5's classic transport fails to release the connection back
# to the pool on an invalid/unsupported Content-Encoding header (pool exhaustion DoS). Affects
# <=5.6.2; fixed in 5.6.3, taken a patch further to 5.6.4. Pulled onto the buildscript classpath via
# org.owasp:dependency-check-gradle -> dependency-check-core -> open-vulnerability-clients, and via
# grails-data-hibernate5-dbmigration -> grails-shell-cli -> spring-boot-cli.
httpClient5Version=5.6.4
bouncyCastleVersion=1.85
grailsSpringSecurityVersion=8.0.0-M5
# grails-mail was merged into the grails-core monorepo as of 7.2.x (RUN-4809); this
# tracks grailsVersion in lockstep the same way grailsSpringSecurityVersion does.
grailsMailVersion=7.2.2
slf4jVersion=2.0.18
seleniumJavaVersion=4.47.0
spockVersion=2.4-groovy-5.0
testContainersVersion=1.21.4
# For verifyBuild script only - actual runtime versions managed by Spring Boot BOM
# CVE-2026-2332 (CWE-444 HTTP request smuggling) - jetty-http fixed in 12.0.33+
# spring-boot-dependencies 4.1.0 (Grails 8.0.0-M5) pins Jetty to 12.1.10, Jetty EE11.
jetty.version=12.1.10
# Spring Boot 4.1.x's own BOM already manages Spring Security at 7.1.x (a major version ahead of
# the 6.x line this override originally pinned for CVE-2026-41706/CVE-2026-47838/CVE-2025-22228);
# bumped to match spring-boot-dependencies:4.1.0's pin instead of forcing a downgrade to 6.5.11,
# which would mismatch Spring Framework 7.0.9 and Spring Security's own expected major version.
spring-security.version=7.1.0
# CVE-2026-41710: spring-retry cache-exhaustion DoS, fixed in 2.0.13 (pulled via spring-integration)
springRetryVersion=2.0.13
log4j2.version=2.26.1
assetPluginVersion=5.0.35
dbMigrationPluginVersion=5.0.0
metricsVersion=4.2.39
micronautVersion=4.10.26
liquibaseVersion=4.33.0
# Jakarta EE versions - keeping explicit (used across 26+ build files)
jakartaAnnotationVersion=3.0.0
jakartaServletVersion=6.1.0
jakartaValidationVersion=3.1.1
jakartaXmlBindVersion=4.0.5
# Keep for metrics 4.x compatibility (uses javax.servlet)
javaxServletVersion=4.0.1
org.gradle.daemon=true
org.gradle.parallel=true
# Increased memory for Groovy 4 + Grails 7 compilation (from 1024M)
org.gradle.jvmargs=-Dfile.encoding=UTF-8 -Xmx4096M -XX:MaxMetaspaceSize=1024M -XX:+HeapDumpOnOutOfMemoryError
