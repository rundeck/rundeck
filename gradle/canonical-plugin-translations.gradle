/**
 * Packages a standalone plugin's canonical public translation bundles from
 * the repository-level translations tree into resources/i18n in its archive.
 *
 * Consumers set canonicalTranslationNamespace before applying this script.
 */
import java.util.zip.ZipFile

if (!project.hasProperty('canonicalTranslationNamespace')) {
    throw new GradleException(
            "Set canonicalTranslationNamespace before applying canonical-plugin-translations.gradle"
    )
}

// Resolve from the standalone plugin project so this remains stable when
// Rundeck projects are included in the Rundeck Pro root build.
File canonicalTranslationDirectory = project.file(
        "../../translations/${project.canonicalTranslationNamespace}"
)

tasks.named('processResources') {
    from(canonicalTranslationDirectory) {
        include 'public-messages*.properties'
        into 'resources/i18n'
    }
}

tasks.register('verifyCanonicalTranslationArchive') {
    dependsOn tasks.named('jar')
    inputs.dir(canonicalTranslationDirectory)
    inputs.file(tasks.named('jar').flatMap { it.archiveFile })

    doLast {
        Map<String, File> expected = fileTree(canonicalTranslationDirectory) {
            include 'public-messages*.properties'
        }.files.collectEntries { [("resources/i18n/${it.name}".toString()): it] }
        ZipFile archive = new ZipFile(tasks.named('jar').get().archiveFile.get().asFile)
        try {
            Map<String, List> entries = archive.entries().toList().groupBy { it.name }
            Set<String> packaged = entries.keySet().findAll {
                it ==~ /resources\/i18n\/public-messages.*\.properties/
            } as Set<String>
            List<String> duplicates = entries.findAll { name, values ->
                name.startsWith('resources/i18n/') &&
                        name.endsWith('.properties') &&
                        values.size() != 1
            }.keySet().toList()
            if (packaged != expected.keySet() || duplicates) {
                throw new GradleException(
                        "Canonical translation archive mismatch: expected ${expected.keySet()}, " +
                                "found ${packaged}, duplicates ${duplicates}"
                )
            }
            expected.each { String archivePath, File source ->
                byte[] packagedBytes = archive.getInputStream(entries[archivePath].first()).bytes
                if (!Arrays.equals(source.bytes, packagedBytes)) {
                    throw new GradleException(
                            "Canonical translation bytes differ for ${archivePath}"
                    )
                }
            }
        } finally {
            archive.close()
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyCanonicalTranslationArchive')
}
