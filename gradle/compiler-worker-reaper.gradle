import org.gradle.api.Task
import org.gradle.api.Transformer
import org.gradle.api.tasks.compile.GroovyCompile

/**
 * Gradle Compiler Worker Reaper
 *
 * Grails 7 injects a unique `-Dbase.dir=<subproject>` JVM flag (and OpenAPI spec tasks inject
 * `-Dmicronaut.openapi.target.file=...`) into every Grails subproject's GroovyCompile forkOptions.
 * Because Gradle pools compiler worker daemons by exact JVM startup flags and classpath, each
 * Grails subproject spawns a single-use GradleWorkerMain JVM (KeepAliveMode.SESSION) that can
 * never be reused by subsequent subprojects and otherwise stays resident in RAM until the Gradle
 * invocation exits (or forever during bootRun).
 *
 * By contrast, plain non-Grails Groovy/Java subprojects (~34 step plugins in rundeckpro) share
 * identical forkOptions and reuse a small warm pool of JIT-compiled worker daemons across the
 * entire build. During compilation (`afterTask`), we therefore surgically stop ONLY idle single-use
 * workers carrying subproject-pinned JVM flags (`-Dbase.dir=`, `-Dmicronaut.openapi.*`), keeping
 * reusable plain-Groovy and Java compiler workers warm and fast until `bootRun` or `buildFinished`.
 *
 * Safeguards:
 * 1. Idempotent across init scripts and composite/submodule builds via extraProperties guard.
 * 2. Skips registration when Gradle Configuration Cache is requested.
 * 3. Resolves internal Gradle worker classes reflectively (zero static internal imports) so future
 *    Gradle 9/10 internal package changes degrade cleanly to a harmless no-op.
 * 4. Uses TaskExecutionGraph listeners rather than task.doLast so @CacheableTask / --build-cache
 *    cache keys and FROM-CACHE hits remain 100% intact.
 */
if (gradle.extensions.extraProperties.has('rundeckCompilerWorkerReaperInstalled')) {
    logger.debug('[compiler-worker-reaper] Already installed in this Gradle build; skipping duplicate registration.')
    return
}
gradle.extensions.extraProperties.set('rundeckCompilerWorkerReaperInstalled', true)

boolean isConfigurationCacheActive = false
try {
    def sp = gradle.startParameter
    if (sp.respondsTo('isConfigurationCacheRequested')) {
        isConfigurationCacheActive = Boolean.TRUE == sp.isConfigurationCacheRequested()
    } else if (sp.hasProperty('configurationCache')) {
        def ccProp = sp.configurationCache
        isConfigurationCacheActive = Boolean.TRUE == (ccProp.respondsTo('get') ? ccProp.get() : ccProp)
    }
} catch (Throwable ignored) {
    isConfigurationCacheActive = false
}

if (isConfigurationCacheActive) {
    logger.debug('[compiler-worker-reaper] Configuration cache requested; skipping hook registration.')
    return
}

def resolveInternalClass = { String className ->
    for (ClassLoader cl : [getClass().classLoader, GroovyCompile.classLoader, gradle.class.classLoader]) {
        if (cl == null) {
            continue
        }
        try {
            return Class.forName(className, false, cl)
        } catch (Throwable ignored) {
        }
    }
    return null
}

Class<?> clientsManagerClass = null
def selectIdleClientsMethod = null
def stopAllWorkersMethod = null

try {
    clientsManagerClass = resolveInternalClass('org.gradle.workers.internal.WorkerDaemonClientsManager')
    if (clientsManagerClass != null) {
        selectIdleClientsMethod = clientsManagerClass.getDeclaredMethod('selectIdleClientsToStop', Transformer)
        selectIdleClientsMethod.accessible = true
        stopAllWorkersMethod = clientsManagerClass.getMethod('stopAllWorkers')
    }
} catch (Throwable t) {
    logger.debug('[compiler-worker-reaper] Gradle internal worker classes unavailable ({}); reaper disabled.', t.toString())
    return
}

if (clientsManagerClass == null || selectIdleClientsMethod == null || stopAllWorkersMethod == null) {
    logger.debug('[compiler-worker-reaper] Gradle internal worker APIs not found; reaper disabled.')
    return
}

def isSingleUseSubprojectWorker = { Object client ->
    try {
        def getForkOpts = client.getClass().getDeclaredMethod('getForkOptions')
        getForkOpts.accessible = true
        def forkOpts = getForkOpts.invoke(client)
        def jvmOpts = forkOpts.getClass().getMethod('getJvmOptions').invoke(forkOpts)
        Collection<?> allArgs = (Collection<?>) jvmOpts.getClass().getMethod('getAllJvmArgs').invoke(jvmOpts)
        return allArgs != null && allArgs.any { Object arg ->
            String s = String.valueOf(arg)
            s.startsWith('-Dbase.dir=') ||
                s.startsWith('-Dmicronaut.openapi.target.file=') ||
                s.startsWith('-Dmicronaut.openapi.additional.files=')
        }
    } catch (Throwable ignored) {
        return false
    }
}

def expireSingleUseIdleWorkers = { String trigger ->
    try {
        def mgr = gradle.services.get(clientsManagerClass)
        int stoppedCount = 0
        selectIdleClientsMethod.invoke(mgr, ({ List<?> idleClients ->
            List<?> victims = idleClients.findAll { Object client -> isSingleUseSubprojectWorker(client) }
            stoppedCount = victims.size()
            return victims
        } as Transformer))
        if (stoppedCount > 0 && logger.isDebugEnabled()) {
            logger.debug(
                '[compiler-worker-reaper] Stopped {} single-use Grails compiler worker(s) after {}',
                stoppedCount,
                trigger
            )
        }
    } catch (Throwable t) {
        logger.debug('[compiler-worker-reaper] Unable to expire single-use workers after {}: {}', trigger, t.toString())
    }
}

def stopAllWorkers = { String trigger ->
    try {
        def mgr = gradle.services.get(clientsManagerClass)
        stopAllWorkersMethod.invoke(mgr)
        logger.debug('[compiler-worker-reaper] Stopped all compiler workers ({})', trigger)
    } catch (Throwable t) {
        logger.debug('[compiler-worker-reaper] Unable to stop compiler workers ({}): {}', trigger, t.toString())
    }
}

gradle.taskGraph.afterTask { Task task ->
    if (task instanceof GroovyCompile && task.didWork) {
        boolean isPinnedTask = false
        try {
            isPinnedTask = task.groovyOptions?.forkOptions?.allJvmArgs?.any { Object arg ->
                String s = String.valueOf(arg)
                s.startsWith('-Dbase.dir=') ||
                    s.startsWith('-Dmicronaut.openapi.target.file=') ||
                    s.startsWith('-Dmicronaut.openapi.additional.files=')
            } ?: false
        } catch (Throwable ignored) {
            isPinnedTask = true
        }
        if (isPinnedTask) {
            expireSingleUseIdleWorkers(task.path)
        }
    }
}

gradle.taskGraph.beforeTask { Task task ->
    if (task.name == 'bootRun') {
        stopAllWorkers("beforeTask ${task.path}")
    }
}

if (gradle.respondsTo('buildFinished')) {
    gradle.buildFinished {
        stopAllWorkers('buildFinished')
    }
}

logger.debug('[compiler-worker-reaper] Installed surgical Gradle compiler worker reaper hooks.')
